<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    width:400px;
    max-width:90%;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
    color:#ff2e63;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#ff2e63;
    color:white;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    opacity:0.9;
}

.hidden{
    display:none;
}

#message{
    margin-top:20px;
    line-height:1.6;
}
</style>
</head>
<body>

<div class="card">

    <div id="page1">
        <h1>Happy Girlfriend Day ❤️</h1>
        <p>For Someone Very Special...</p>
        <button onclick="openHeart()">Open My Heart ❤️</button>
    </div>

    <div id="page2" class="hidden">
        <h1>Dear Rinosia ❤️</h1>

        <p>
            You make my days brighter and my heart happier.
            Thank you for being such an amazing person.
        </p>

        <button onclick="showSecret()">
            Tap For A Secret 💌
        </button>

        <div id="message"></div>
    </div>

</div>

<script>

function openHeart(){
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function showSecret(){

    document.getElementById("message").innerHTML =

    "<br><b>💌 Secret Message 💌</b><br><br>" +

    "Happy Girlfriend Day, Rinosia ❤️<br><br>" +

    "Thank you for every smile, every laugh, and every moment we share together. 🌹<br><br>" +

    "You are beautiful, special, and deeply appreciated. ❤️<br><br>" +

    "Whenever I think of you, I find another reason to smile. 🥰<br><br>" +

    "<button onclick='finalSurprise()'>🎁 Final Surprise ❤️</button>";
}

function finalSurprise(){

    document.getElementById("message").innerHTML +=

    "<br><br><hr><br>" +

    "<h2>❤️ Rinosia ❤️</h2>" +

    "If I could choose one person to make smile every day, it would always be you. 🌹<br><br>" +

    "Happy Girlfriend Day, Beautiful. ❤️✨";
}

</script>

</body>
</html>
